server:
  port: 8080
  readTimeout: "10s"
  writeTimeout: "10s"
  idleTimeout: "60s"
  enableLogging: true
  tls:
    enabled: false

services:
  - version: 1
    services:
      - name: "Identity Service"
        description: "Identity & registration services"
        host: "http://127.0.0.1:7101"
        tags: ["public", "auth"]
        group: "miku"
        routes:
          - path: "/iam/{rest:.*}"
            methods: ["GET"]
            requireAuth: false
            stripPath: true
            enabled: true
            backend:
              - url_pattern: "/api/{rest:.*}"

plugins:
  billing:
    enabled: true
    database_url: "postgres://user:pass@localhost:5432/yourdb?sslmode=disable"
    redis_url: "redis://localhost:6379/0"
    queue_size: 10000
    workers: 10
    plan_cache_ttl: 60
    kafka_brokers:
      - "localhost:9092"
    topic_name: "billing-events"
    worker_count: 1
    retry_attempts: 3
    batch_size: 1
    flush_interval: 1s

