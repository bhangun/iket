name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.25.0'
    - name: Build server
      run: CGO_ENABLED=0 go build -o iket-server ./cmd/iket
    - name: Build client
      run: CGO_ENABLED=0 go build -o iket ./cmd/iket-cli
    #- name: Test
    #  run: go test ./...
