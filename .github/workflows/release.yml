permissions:
  contents: write

name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build release binaries
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-13
            goos: darwin
            goarch: amd64
          - runner: macos-14
            goos: darwin
            goarch: arm64
          - runner: windows-latest
            goos: windows
            goarch: amd64
      fail-fast: false
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.8'

      - name: Set version from tag
        id: get_version
        shell: bash
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_ENV

      - name: Build client binary
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=0 \
          go build -ldflags "-w -s -X 'github.com/bhangun/iket/pkg/app.Version=${VERSION}'" \
            -o dist/iket-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./cmd/iket-cli

      - name: Build server binary
        shell: bash
        run: |
          mkdir -p dist
          EXT=""
          if [ "${{ matrix.goos }}" = "windows" ]; then EXT=".exe"; fi
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} CGO_ENABLED=1 \
          go build -ldflags "-X 'github.com/bhangun/iket/pkg/app.Version=${VERSION}'" \
            -o dist/iket-server-${{ matrix.goos }}-${{ matrix.goarch }}$EXT ./cmd/iket/main.go

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
          path: |
            dist/iket-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/iket-${{ matrix.goos }}-${{ matrix.goarch }}.exe
            dist/iket-server-${{ matrix.goos }}-${{ matrix.goarch }}
            dist/iket-server-${{ matrix.goos }}-${{ matrix.goarch }}.exe

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Display files
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
