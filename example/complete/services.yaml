version: 1
services:
  - name: "User Service"
    description: "Handles user registration and authentication"
    host: "http://localhost:7112"
    # base_path: "/user"
    tags: ["public", "auth"]
    group: "miku"
    routes:
        - path: "/api/{rest:.*}"
          methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
          requireAuth: false
          stripPath: false
        - path: "/docs/{rest:.*}"
          methods: ["GET"]
          requireAuth: false
          stripPath: true
        - path: "/openapi"
          methods: ["GET", "OPTIONS"]
          requireAuth: false 
          stripPath: false
