version: '3.8'

services:
  # Iket API Gateway (Prebuilt)
  iket:
    image: bhangun/iket:latest
    container_name: iket
    restart: unless-stopped
    ports:
      - "7100:8080" # Management / HTTP
      - "8443:8443" # HTTPS / mTLS
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - TZ=UTC
    volumes:
      - ../config:/app/config:ro
      - ../certs:/app/certs:rw
      - ../logs:/app/logs:rw
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - iket-network

networks:
  iket-network:
    driver: bridge
